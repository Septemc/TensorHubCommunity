# Temporary Nginx config for initial SSL certificate generation
# This is used BEFORE the real production config to serve ACME challenges
# Usage: This config is automatically created by deploy.sh

server {
    listen 80;
    listen [::]:80;
    server_name tensorhub.cn www.tensorhub.cn;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 200 "TensorHub - Certificate generation in progress...";
        add_header Content-Type text/plain;
    }
}