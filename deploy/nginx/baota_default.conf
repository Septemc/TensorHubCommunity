# ============================================
# 宝塔面板 Nginx 站点配置
# 域名: community.tensorhub.cn
# 前端: /www/wwwroot/community.tensorhub.cn
# 后端: Docker 运行在 localhost:8000
# ============================================

# HTTP -> HTTPS 重定向
server {
    listen 80;
    listen [::]:80;
    server_name community.tensorhub.cn;

    # Let's Encrypt 验证路径（宝塔自动管理）
    location /.well-known/acme-challenge/ {
        root /www/wwwroot/community.tensorhub.cn;
    }

    # 强制跳转 HTTPS
    location / {
        return 301 https://community.tensorhub.cn$request_uri;
    }
}

# HTTPS 主配置
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name community.tensorhub.cn;

    # ---- SSL 证书（宝塔面板自动管理，路径如下） ----
    # 宝塔面板申请证书后自动填入，以下为默认路径，请以宝塔实际路径为准
    ssl_certificate /www/server/panel/vhost/cert/community.tensorhub.cn/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/community.tensorhub.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_timeout 1d;
    ssl_session_cache shared:MozSSL:10m;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains; preload" always;

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ---- 前端静态文件 ----
    root /www/wwwroot/community.tensorhub.cn;
    index index.html;

    # 上传文件目录（后端 Docker 映射到宿主机）
    location /uploads/ {
        alias /www/wwwroot/tensorhub_app/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # API 反向代理到后端
    location /api/ {
        proxy_pass http://127.0.0.1:8000/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # Vue Router history 模式 - 所有前端路由回退到 index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # 禁止访问隐藏文件
    location ~ /\. {
        deny all;
    }

    # 静态资源长缓存（Vite 构建的 assets 带 hash）
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # 日志
    access_log /www/wwwlogs/community.tensorhub.cn.log;
    error_log /www/wwwlogs/community.tensorhub.cn.error.log;
}