server
{
    listen 80;
    server_name community.tensorhub.cn;
    index index.html;
    root /www/wwwroot/community.tensorhub.cn;

    #CERT-APPLY-CHECK--START
    # 用于SSL证书申请时的文件验证相关配置 -- 请勿删除
    include /www/server/panel/vhost/nginx/well-known/community.tensorhub.cn.conf;
    #CERT-APPLY-CHECK--END
    include /www/server/panel/vhost/nginx/extension/community.tensorhub.cn/*.conf;
    
    #SSL-START SSL相关配置，请勿删除或修改下一行带注释的404规则
    #error_page 404/404.html;
    #SSL-END

    #ERROR-PAGE-START  错误页配置，可以注释、删除或修改
    #error_page 404 /404.html;
    #error_page 502 /502.html;
    #ERROR-PAGE-END

    #PHP-INFO-START  PHP引用配置，可以注释或修改
    #PHP-INFO-END

    #REWRITE-START URL重写规则引用,修改后将导致面板设置的伪静态规则失效
    include /www/server/panel/vhost/rewrite/community.tensorhub.cn.conf;
    #REWRITE-END

    # 禁止访问的敏感文件
    location ~* (\.user.ini|\.htaccess|\.htpasswd|\.env.*|\.project|\.bashrc|\.bash_profile|\.bash_logout|\.DS_Store|\.gitignore|\.gitattributes|LICENSE|README\.md|CLAUDE\.md|CHANGELOG\.md|CHANGELOG|CONTRIBUTING\.md|TODO\.md|FAQ\.md|DEPLOY.*\.md|composer\.json|composer\.lock|package(-lock)?\.json|yarn\.lock|pnpm-lock\.yaml|\.\w+~|\.swp|\.swo|\.bak(up)?|\.old|\.tmp|\.temp|\.log|\.sql(\.gz)?|docker-compose.*\.yml|docker\.env|Dockerfile|\.csproj|\.sln|Cargo\.toml|Cargo\.lock|go\.mod|go\.sum|pyproject\.toml|requirements\.txt|application(-\w+)?\.(ya?ml|properties))$
    {
        return 404;
    }
    
    # 禁止访问的敏感目录
    location ~* /(\.git|\.svn|\.bzr|\.vscode|\.claude|\.idea|\.ssh|\.github|\.npm|\.yarn|\.pnpm|\.cache|\.husky|\.turbo|\.next|\.nuxt|node_modules|runtime)/ {
        return 404;
    }

    #一键申请SSL证书验证目录相关设置
    location ~ \.well-known{
        allow all;
    }

    #禁止在证书验证目录放入敏感文件
    if ( $uri ~ "^/\.well-known/.*\.(php|jsp|py|js|css|lua|ts|go|zip|tar\.gz|rar|7z|sql|bak)$" ) {
        return 403;
    }

    # ---- Gzip 压缩 ----
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript image/svg+xml;

    # ---- 安全头 ----
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # ---- API 反向代理到后端 ----
    location /api/ {
        proxy_pass http://127.0.0.1:8100/api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
    }

    # ---- 上传文件目录（后端 Docker 映射到宿主机） ----
    location /uploads/ {
        alias /www/wwwroot/TensorHubCommunity/uploads/;
        expires 7d;
        add_header Cache-Control "public, immutable";
    }

    # ---- 静态资源长缓存（Vite 构建的 assets 带 hash） ----
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # ---- Vue Router history 模式 - SPA 回退 ----
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ---- 图片缓存 ----
    location ~ .*\.(gif|jpg|jpeg|png|bmp|swf|ico|svg|webp)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    # ---- JS/CSS 缓存 ----
    location ~ .*\.(js|css)$ {
        expires 12h;
        error_log /dev/null;
        access_log /dev/null;
    }

    # ---- 字体文件缓存 ----
    location ~ .*\.(woff2?|ttf|otf|eot)$ {
        expires 30d;
        error_log /dev/null;
        access_log /dev/null;
    }

    access_log  /www/wwwlogs/community.tensorhub.cn.log;
    error_log  /www/wwwlogs/community.tensorhub.cn.error.log;
}

# ---- HTTPS 配置 ----
# 在宝塔面板申请 SSL 证书后，会自动在此文件中添加 443 端口的 server 块。
# 添加 SSL 后，请确保在 443 server 块中也加入上述 /api/、/uploads/、/assets/、location / 等配置块。
# 或者可以使用宝塔面板的"强制HTTPS"功能，它会自动处理 HTTP 到 HTTPS 的重定向。
#
# 如果宝塔面板自动生成的 443 配置块没有包含上述 location 规则，
# 你需要手动将 /api/、/uploads/、/assets/ 和 SPA 回退规则复制到 443 server 块中。